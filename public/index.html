<!doctype html><html><head><meta charset="utf-8"><title>DealLens v2</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;background:#0a0a0a;color:#e8e8e8;line-height:1.5}.wrap{max-width:1100px;margin:0 auto;padding:32px 24px}h1{font-size:42px;margin:0 0 8px;letter-spacing:-1px}.sub{color:#888;margin-bottom:32px;font-size:17px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}.card{background:#141414;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:16px}.card h3{margin:0 0 12px;font-size:15px;color:#9aa;text-transform:uppercase;letter-spacing:1px}button{background:#fff;color:#000;border:0;padding:14px 22px;border-radius:10px;font-weight:600;cursor:pointer;font-size:15px}button:hover{opacity:.85}#drop{border:2px dashed #333;border-radius:14px;padding:32px;text-align:center;color:#777;cursor:pointer}#drop.hover{border-color:#fff;color:#fff}.rec{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;letter-spacing:1px}.rec.PASS{background:#3a1414;color:#ff6b6b}.rec.TRACK{background:#3a3014;color:#ffc36b}.rec.DILIGENCE{background:#143a2a;color:#6bff9e}.rec.TERM_SHEET{background:#142a3a;color:#6bb6ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.metric{background:#0f0f0f;border:1px solid #1f1f1f;border-radius:10px;padding:14px}.metric .n{font-size:28px;font-weight:700}.metric .l{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px}.bar{height:6px;background:#222;border-radius:3px;margin-top:6px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#6bff9e,#6bb6ff)}.flag{background:#1a0e0e;border-left:3px solid #ff6b6b;padding:10px 14px;border-radius:6px;margin:6px 0;font-size:14px}.q{background:#0e131a;border-left:3px solid #6bb6ff;padding:10px 14px;border-radius:6px;margin:6px 0;font-size:14px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:760px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>DealLens</h1><div class="sub">Opinionated VC scorecard for pitch decks. Pass / Track / Diligence call in 15 seconds.</div><div class="hero"><div class="card"><h3>Try it instantly</h3><p style="color:#aaa;margin:0 0 16px">Full scorecard on a canned seed deck. No upload.</p><button id="sample">Run sample deck</button></div><div class="card"><h3>Or analyze your deck</h3><div id="drop">Drop PDF here or click<input type="file" id="file" accept="application/pdf" hidden></div></div></div><div id="status"></div><div id="out"></div></div><script>
const $=s=>document.querySelector(s);
const rec={PASS:'PASS',TRACK:'TRACK',DILIGENCE:'DILIGENCE',TERM_SHEET:'TERM SHEET'};
async function run(fn){$('#status').innerHTML='<div class=card><span class=spin></span> &nbsp;Analyzing with Gemini...</div>';$('#out').innerHTML='';try{const r=await fn();render(r)}catch(e){$('#status').innerHTML='<div class=card style="color:#ff6b6b">Error: '+e.message+'</div>'}}
function render(d){$('#status').innerHTML='';const sc=d.scorecard||{};const metrics=Object.entries(sc).map(([k,v])=>`<div class=metric><div class=l>${k.replace('_',' ')}</div><div class=n>${v.score}<span style="font-size:14px;color:#666">/10</span></div><div class=bar><div style="width:${v.score*10}%"></div></div><div style="font-size:12px;color:#888;margin-top:8px">${v.reasoning}</div></div>`).join('');const flags=(d.red_flags||[]).map(f=>`<div class=flag>${f}</div>`).join('');const qs=(d.diligence_questions||[]).map(q=>`<div class=q>${q}</div>`).join('');const comps=(d.comparables||[]).map(c=>`<div class=q style="border-color:#9aa"><b>${c.name}</b> &mdash; ${c.why}</div>`).join('');$('#out').innerHTML=`<div class=card><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px"><div><div style="font-size:24px;font-weight:700">${d.company||''}</div><div style="color:#888">${d.one_liner||''}</div></div><div style="text-align:right"><span class="rec ${d.recommendation}">${rec[d.recommendation]||d.recommendation}</span><div style="color:#888;font-size:13px;margin-top:6px">Conviction: ${d.conviction}/10</div></div></div><div class=grid>${metrics}</div></div><div class=card><h3>Red flags</h3>${flags||'<div style=color:#666>None flagged.</div>'}</div><div class=card><h3>Diligence questions</h3>${qs}</div><div class=card><h3>Comparables</h3>${comps}</div><div class=card><h3>Memo</h3><div style="white-space:pre-wrap;color:#ccc">${d.memo||''}</div></div>`}
$('#sample').onclick=()=>run(()=>fetch('/api/analyze-sample',{method:'POST'}).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j}));
$('#drop').onclick=()=>$('#file').click();
$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('hover')};
$('#drop').ondragleave=()=>$('#drop').classList.remove('hover');
$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('hover');upload(e.dataTransfer.files[0])};
$('#file').onchange=e=>upload(e.target.files[0]);
function upload(f){if(!f)return;const fd=new FormData();fd.append('pdf',f);run(()=>fetch('/api/analyze',{method:'POST',body:fd}).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j}))}
</script></body></html>
