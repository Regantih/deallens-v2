<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealLens v2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    #drop-zone {
      border: 2px dashed #555;
      border-radius: 10px;
      width: 300px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    #drop-zone.dragover {
      border-color: #007bff;
    }
    #drop-zone p {
      margin: 0;
      text-align: center;
    }
    #file-input {
      display: none;
    }
    #result {
      margin-top: 20px;
      width: 100%;
      max-width: 800px;
    }
    .section {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .section h2 {
      margin-top: 0;
      color: #007bff;
    }
    .section p {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>DealLens v2</h1>
  <div id="drop-zone">
    <p>Drag and drop a PDF pitch deck here or click to select</p>
    <input type="file" id="file-input" accept=".pdf">
  </div>
  <div id="result" style="display: none;"></div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const resultDiv = document.getElementById('result');

    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    async function handleFile(file) {
      if (file.type !== 'application/pdf') {
        alert('Please select a PDF file.');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/api/memo', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Failed to process PDF');
        }

        const data = await response.json();
        displayResult(data);
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    function displayResult(data) {
      resultDiv.innerHTML = '';
      const sections = ['thesis', 'market', 'team', 'traction', 'risks'];
      sections.forEach(section => {
        if (data[section]) {
          const div = document.createElement('div');
          div.className = 'section';
          div.innerHTML = `<h2>${section.charAt(0).toUpperCase() + section.slice(1)}</h2><p>${data[section]}</p>`;
          resultDiv.appendChild(div);
        }
      });
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
