name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Create Artifact Registry repo if missing
        run: |
          if ! gcloud artifacts repositories describe deallens-v2 --location=us-central1 > /dev/null 2>&1; then
            gcloud artifacts repositories create deallens-v2 --repository-format=docker --location=us-central1
          fi

      - name: Build and push Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/deallens-v2/app:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/deallens-v2/app:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy deallens-v2 \
            --image=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/deallens-v2/app:${{ github.sha }} \
            --region=us-central1 \
            --allow-unauthenticated \
            --platform=managed \
            --set-env-vars=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},COMMIT_SHA=${{ github.sha }}

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe deallens-v2 --region=us-central1 --format="value(status.url)")
          echo "Service URL: $SERVICE_URL"